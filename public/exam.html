<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsoft Office online assessment</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1b1f24; --muted:#5d6672; --line:#d9d6cd; --accent:#0f4c81; --accent-fg:#fff; --bad:#a32020; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181c; --fg:#ecebe6; --muted:#9aa3ad; --line:#2d333b; --accent:#6fa8dc; --accent-fg:#0d1620; --bad:#ff8a8a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width:640px; margin:0 auto; padding:32px 18px 80px; }
  h1 { font-size:1.9rem; line-height:1.2; margin:0 0 8px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  input[type=text] { width:100%; padding:12px; font:inherit; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
  button { font:inherit; font-weight:600; padding:12px 22px; border:0; border-radius:6px; background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .q { border-top:1px solid var(--line); padding:18px 0; }
  .q p { margin:0 0 10px; font-weight:600; }
  label.opt { display:flex; gap:10px; align-items:flex-start; padding:9px 12px; margin:6px 0; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  label.opt:has(input:checked) { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent); }
  #timer { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 0; font-weight:700; font-variant-numeric:tabular-nums; }
  .check { display:flex; gap:10px; margin:14px 0 18px; color:var(--muted); font-size:.95rem; }
  .err { color:var(--bad); min-height:1.5em; margin-top:10px; }
  .hidden { display:none; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <section id="intro">
    <h1>Microsoft Office online assessment</h1>
    <p class="lead">Questions on Word, Excel and PowerPoint. You have 25 minutes and need 70% to pass. This is an unsupervised assessment run by Dabik Technologies.</p>
    <label for="name">Full name, exactly as it should appear on your certificate</label>
    <input id="name" type="text" maxlength="60" autocomplete="name">
    <label class="check"><input id="confirm" type="checkbox"> I confirm my name is spelled correctly. It cannot be changed after I start.</label>
    <button id="start" disabled>Start the assessment</button>
    <div id="err" class="err" role="alert"></div>
  </section>

  <section id="exam" class="hidden">
    <div id="timer"></div>
    <div id="questions"></div>
    <div class="actions"><button id="submit">Submit answers</button></div>
  </section>

  <section id="result" class="hidden">
    <h1 id="msg"></h1>
    <p id="sub" class="lead"></p>
    <div class="actions">
      <button id="download" class="hidden">Download certificate (PDF)</button>
      <button id="retry" class="hidden" onclick="location.reload()">Try again</button>
    </div>
    <p id="vlink" class="lead hidden"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let attempt, questions, answers, deadline, tick, submitting = false;

const refresh = () => { $("start").disabled = !($("confirm").checked && $("name").value.trim().length >= 2); };
$("name").oninput = refresh; $("confirm").onchange = refresh;

$("start").onclick = async () => {
  $("err").textContent = ""; $("start").disabled = true;
  try {
    const r = await fetch("/api/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("name").value }) });
    const d = await r.json();
    if (!r.ok) { $("err").textContent = d.error || "Could not start. Try again."; refresh(); return; }
    attempt = d.attempt; questions = d.questions;
    answers = new Array(questions.length).fill(null);
    deadline = Date.now() + d.limitSec * 1000;
    renderQuestions();
    $("intro").classList.add("hidden"); $("exam").classList.remove("hidden");
    tick = setInterval(updateTimer, 500); updateTimer();
  } catch { $("err").textContent = "No connection. Check your network and try again."; refresh(); }
};

function renderQuestions() {
  const box = $("questions"); box.innerHTML = "";
  questions.forEach((q, i) => {
    const wrap = document.createElement("div"); wrap.className = "q";
    const p = document.createElement("p"); p.textContent = (i + 1) + ". " + q.q; wrap.appendChild(p);
    q.options.forEach((text, j) => {
      const l = document.createElement("label"); l.className = "opt";
      const r = document.createElement("input"); r.type = "radio"; r.name = "q" + i;
      r.onchange = () => { answers[i] = j; };
      const s = document.createElement("span"); s.textContent = text;
      l.append(r, s); wrap.appendChild(l);
    });
    box.appendChild(wrap);
  });
}

function updateTimer() {
  const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
  $("timer").textContent = "Time left " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  if (left === 0) submit();
}

$("submit").onclick = submit;
async function submit() {
  if (submitting) return; submitting = true; $("submit").disabled = true;
  try {
    const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ attempt, answers }) });
    const d = await r.json();
    clearInterval(tick);
    $("exam").classList.add("hidden"); $("result").classList.remove("hidden");
    if (!r.ok) { $("msg").textContent = "This attempt could not be scored"; $("sub").textContent = d.error || ""; $("retry").classList.remove("hidden"); return; }
    if (!d.passed) { $("msg").textContent = "You scored " + d.score + "%"; $("sub").textContent = "The pass mark is " + d.pass + "%. Review the Office roadmap and try again."; $("retry").classList.remove("hidden"); return; }
    $("msg").textContent = "You passed with " + d.score + "%";
    $("sub").textContent = "Download your certificate now. Keep the link below to verify it later.";
    $("download").classList.remove("hidden");
    $("download").onclick = () => makePdf(d).catch((error) => {
      console.error("Certificate PDF generation failed:", error);
      alert("Could not create the certificate PDF. Please try again.");
    });
    const url = location.origin + "/verify/" + d.cert;
    const a = document.createElement("a"); a.href = url; a.textContent = "Your verification link";
    $("vlink").append(a); $("vlink").classList.remove("hidden");
  } catch { submitting = false; $("submit").disabled = false; alert("No connection. Your answers are still on this page. Try submitting again."); }
}

async function makePdf(d) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
  const W = 842, H = 595, C = { align: "center" };
  const url = location.origin + "/verify/" + d.cert;
  const logo = await loadCertificateLogo();
  const palette = {
    ink: [27, 42, 55], muted: [91, 109, 121], blue: [34, 93, 145],
    teal: [39, 139, 143], paleBlue: [235, 245, 250], paleTeal: [227, 244, 241],
    gold: [190, 143, 44], paleGold: [250, 242, 217], white: [255, 255, 255],
  };
  const center = W / 2;
  const textFit = (text, maxWidth, startSize, minSize) => {
    let size = startSize;
    doc.setFontSize(size);
    while (doc.getTextWidth(text) > maxWidth && size > minSize) {
      doc.setFontSize(--size);
    }
    return size;
  };
  const drawStar = (x, y, outer, inner) => {
    const points = [];
    for (let i = 0; i < 10; i++) {
      const radius = i % 2 === 0 ? outer : inner;
      const angle = -Math.PI / 2 + i * Math.PI / 5;
      points.push([x + Math.cos(angle) * radius, y + Math.sin(angle) * radius]);
    }
    doc.lines(
      points.slice(1).map((point, i) => [point[0] - points[i][0], point[1] - points[i][1]]),
      points[0][0], points[0][1], [1, 1], "F", true
    );
  };
  const formatIssuedDate = (value) => {
    const date = new Date(String(value) + "T00:00:00Z");
    return Number.isNaN(date.getTime())
      ? String(value)
      : date.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  };

  const gradientSteps = 100;
  for (let i = 0; i < gradientSteps; i++) {
    const t = i / (gradientSteps - 1);
    doc.setFillColor(
      Math.round(248 + (231 - 248) * t),
      Math.round(251 + (246 - 251) * t),
      Math.round(253 + (244 - 253) * t)
    );
    doc.rect(0, i * H / gradientSteps, W, H / gradientSteps + 0.5, "F");
  }
  doc.setFillColor(...palette.paleTeal);
  doc.triangle(0, 0, 164, 0, 0, 116, "F");
  doc.triangle(W, H, W - 154, H, W, H - 110, "F");
  doc.setFillColor(241, 248, 249);
  doc.circle(W - 52, 126, 62, "F");
  doc.circle(52, H - 54, 46, "F");

  doc.setDrawColor(...palette.blue);
  doc.setLineWidth(2);
  doc.rect(24, 24, W - 48, H - 48);
  doc.setDrawColor(...palette.teal);
  doc.setLineWidth(0.7);
  doc.rect(32, 32, W - 64, H - 64);
  doc.setDrawColor(...palette.blue);
  doc.setLineWidth(0.6);
  doc.line(64, 124, W - 64, 124);

  doc.addImage(logo, "PNG", 58, 48, 62, 62);
  doc.setTextColor(...palette.ink);
  doc.setFont("times", "bold");
  doc.setFontSize(15);
  doc.text("Dabik Technologies", 132, 74);
  doc.setFont("times", "italic");
  doc.setFontSize(10);
  doc.setTextColor(...palette.muted);
  doc.text("Solve Smarter", 132, 92);

  const officeIcons = [
    { letter: "W", color: [43, 87, 154] },
    { letter: "X", color: [30, 107, 65] },
    { letter: "P", color: [183, 57, 26] },
  ];
  officeIcons.forEach((icon, index) => {
    const x = 686 + index * 36;
    doc.setFillColor(...icon.color);
    doc.roundedRect(x, 58, 27, 27, 4, 4, "F");
    doc.setTextColor(...palette.white);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.text(icon.letter, x + 13.5, 76, { align: "center" });
  });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7);
  doc.setTextColor(...palette.muted);
  doc.text("WORD       EXCEL     POWERPOINT", 699, 98, { align: "center" });

  doc.setTextColor(...palette.blue);
  doc.setFont("times", "bold");
  doc.setFontSize(31);
  doc.text("Certificate of Completion", center, 166, C);
  doc.setDrawColor(...palette.teal);
  doc.setLineWidth(1.2);
  doc.line(center - 75, 181, center + 75, 181);

  doc.setTextColor(...palette.muted);
  doc.setFont("times", "normal");
  doc.setFontSize(14);
  doc.text("This certifies that", center, 211, C);

  const candidateName = String(d.name);
  doc.setTextColor(...palette.ink);
  doc.setFont("times", "bold");
  doc.setFontSize(42);
  textFit(candidateName, W - 210, 42, 25);
  doc.text(candidateName, center, 260, C);

  doc.setFont("times", "normal");
  doc.setFontSize(15);
  doc.setTextColor(...palette.ink);
  doc.text("passed the Microsoft Office Online Assessment", center, 294, C);
  doc.setFillColor(...palette.paleTeal);
  doc.setDrawColor(185, 222, 216);
  doc.roundedRect(center - 76, 307, 152, 43, 10, 10, "FD");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.setTextColor(...palette.teal);
  doc.text("ASSESSMENT SCORE", center, 322, C);
  doc.setFontSize(19);
  doc.setTextColor(...palette.ink);
  doc.text(String(d.score) + "%", center, 342, C);

  doc.setFont("times", "italic");
  doc.setFontSize(11);
  doc.setTextColor(...palette.muted);
  doc.text("Unsupervised online assessment. Name as entered by the candidate.", center, 371, C);
  doc.setFont("times", "normal");
  doc.setFontSize(12);
  doc.setTextColor(...palette.ink);
  doc.text("Issued " + formatIssuedDate(d.date) + " by Dabik Technologies", center, 394, C);

  doc.setDrawColor(198, 215, 222);
  doc.setLineWidth(0.6);
  doc.line(64, 416, W - 64, 416);

  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();
  const moduleCount = qr.getModuleCount();
  const qrSize = 94;
  const moduleSize = qrSize / moduleCount;
  const qrX = 66;
  const qrY = 438;
  doc.setFillColor(...palette.white);
  doc.roundedRect(qrX - 5, qrY - 5, qrSize + 10, qrSize + 10, 4, 4, "F");
  doc.setFillColor(...palette.ink);
  for (let row = 0; row < moduleCount; row++) {
    for (let col = 0; col < moduleCount; col++) {
      if (qr.isDark(row, col)) {
        doc.rect(qrX + col * moduleSize, qrY + row * moduleSize, moduleSize + 0.15, moduleSize + 0.15, "F");
      }
    }
  }
  doc.link(qrX - 5, qrY - 5, qrSize + 10, qrSize + 10, { url });

  doc.setTextColor(...palette.muted);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.text("SCAN TO VERIFY", 180, 458);
  doc.setTextColor(...palette.ink);
  doc.setFont("courier", "bold");
  doc.setFontSize(11);
  doc.text("Certificate ID", 180, 478);
  doc.setFontSize(13);
  doc.text(String(d.id), 180, 499);
  doc.setTextColor(...palette.blue);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9);
  doc.textWithLink("Open certificate verification", 180, 519, { url });

  const signX = 490;
  const signW = 158;
  doc.setDrawColor(...palette.teal);
  doc.setLineWidth(0.9);
  doc.line(signX, 486, signX + signW, 486);
  doc.setTextColor(...palette.ink);
  doc.setFont("times", "bold");
  doc.setFontSize(13);
  doc.text("Dabik Technologies", signX + signW / 2, 506, C);
  doc.setFont("times", "normal");
  doc.setFontSize(9);
  doc.setTextColor(...palette.muted);
  doc.text("Assessment Issuer", signX + signW / 2, 522, C);

  const sealX = 744;
  const sealY = 484;
  doc.setFillColor(...palette.paleGold);
  doc.setDrawColor(...palette.gold);
  doc.setLineWidth(1.8);
  doc.circle(sealX, sealY, 43, "FD");
  doc.setLineWidth(0.7);
  doc.circle(sealX, sealY, 37, "S");
  doc.setFillColor(...palette.gold);
  drawStar(sealX, sealY - 19, 5, 2.3);
  drawStar(sealX - 17, sealY - 16, 3.2, 1.5);
  drawStar(sealX + 17, sealY - 16, 3.2, 1.5);
  doc.setTextColor(119, 83, 20);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(7.5);
  doc.text("COURSE", sealX, sealY + 1, C);
  doc.text("COMPLETED", sealX, sealY + 11, C);
  drawStar(sealX - 8, sealY + 22, 2.5, 1.2);
  drawStar(sealX, sealY + 23, 2.5, 1.2);
  drawStar(sealX + 8, sealY + 22, 2.5, 1.2);
  doc.save("Office-Assessment-Certificate.pdf");
}

function loadCertificateLogo() {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const context = canvas.getContext("2d");
      if (!context) { reject(new Error("Could not prepare the certificate logo.")); return; }
      context.drawImage(image, 0, 0);
      resolve(canvas.toDataURL("image/png"));
    };
    image.onerror = () => reject(new Error("Could not load the certificate logo."));
    image.src = new URL("/assets/logo.png", location.origin).href;
  });
}
</script>
</body>
</html>
