<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Certificate verification</title>
<style>
  :root {
    --bg:#fbfaf7; --fg:#1b1f24; --muted:#5d6672; --line:#d9d6cd; --card:#ffffff; --accent:#0f4c81; --accent-fg:#ffffff;
    --ok:#1f6b3a; --ok-bg:#eaf4ee; --bad:#a32020; --bad-bg:#fbeeee; --warn:#7a4f00; --warn-bg:#fbf3e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#15181c; --fg:#ecebe6; --muted:#9aa3ad; --line:#2d333b; --card:#1c2026; --accent:#6fa8dc; --accent-fg:#0d1620;
      --ok:#7fd59b; --ok-bg:#16261c; --bad:#ff8a8a; --bad-bg:#2a1718; --warn:#f2c26b; --warn-bg:#2a2216;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width:600px; margin:0 auto; padding:36px 18px 72px; }
  .brand { margin:0 0 4px; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  h1 { margin:0 0 22px; font-size:1.6rem; line-height:1.25; }
  h2 { margin:0; font-size:1.3rem; line-height:1.3; }
  h2:focus { outline:none; }
  .panel { background:var(--card); border:1px solid var(--line); border-left-width:6px; border-radius:8px; padding:20px; }
  .panel.ok { border-left-color:var(--ok); }
  .panel.bad { border-left-color:var(--bad); }
  .panel.warn { border-left-color:var(--warn); }
  .badge { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .ok .badge { color:var(--ok); } .bad .badge { color:var(--bad); } .warn .badge { color:var(--warn); }
  .badge svg { flex:none; }
  .panel p { margin:0 0 12px; } .panel ul { margin:0 0 12px; padding-left:22px; } .panel li { margin:4px 0; }
  .muted { color:var(--muted); font-size:.95rem; }
  dl { margin:16px 0; border-top:1px solid var(--line); }
  dl div { display:flex; gap:16px; padding:11px 0; border-bottom:1px solid var(--line); }
  dt { width:128px; flex:none; color:var(--muted); }
  dd { margin:0; font-weight:600; min-width:0; overflow-wrap:anywhere; }
  dd.name { font-size:1.35rem; }
  dd.mono { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:500; letter-spacing:.03em; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; }
  button, a.btn { font:inherit; font-weight:600; padding:10px 18px; border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:var(--accent-fg); cursor:pointer; text-decoration:none; }
  button.ghost, a.btn.ghost { background:transparent; color:var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  form.paste { margin-top:6px; } form.paste label { display:block; margin-bottom:6px; font-weight:600; }
  form.paste input { width:100%; padding:11px; font:inherit; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; margin-bottom:10px; }
  .inline-err { color:var(--bad); margin:8px 0 0; min-height:1.4em; }
  .spinner { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; border-top-color:var(--line); } }
  @media (max-width:420px) { dl div { flex-direction:column; gap:2px; } dt { width:auto; } }
  @media print {
    body { background:#fff; color:#000; } .actions, form.paste, .noprint { display:none !important; }
    .panel { border:2px solid #000; border-left-width:2px; }
  }
</style>
</head>
<body>
<main>
  <p class="brand">Dabik Technologies</p>
  <h1>Certificate verification</h1>
  <div id="view" aria-live="polite" aria-busy="true"></div>
  <noscript><div class="panel warn"><p>JavaScript is needed to check a certificate. Please turn it on and reload this page.</p></div></noscript>
</main>
<script>
(() => {
  const view = document.getElementById("view");
  const SHAPE = /^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/;
  const OTHER_TRACK_URL = "https://www.dabikgroup.com.ng/verify"; // replace with the real supervised-certificate verification URL
  const PREFIX = "Certificate verification";

  const ICON = {
    ok:   '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".16"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bad:  '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".16"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    warn: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor" opacity=".16"/><path d="M12 7v6.2M12 16.6v.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
  };

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    for (const k in props || {}) {
      if (k === "class") n.className = props[k];
      else if (k === "text") n.textContent = props[k];
      else n.setAttribute(k, props[k]);
    }
    kids.flat().filter(Boolean).forEach((c) => n.append(c));
    return n;
  }
  const link = (href, text, cls) => el("a", { href, class: cls || "", text });

  function show(kind, docTitle, title, ...content) {
    const badge = el("div", { class: "badge" });
    if (ICON[kind]) { const s = el("span"); s.innerHTML = ICON[kind]; badge.append(s); }
    badge.append(el("h2", { id: "result-title", tabindex: "-1", text: title }));
    view.replaceChildren(el("div", { class: "panel " + kind }, badge, ...content));
    view.setAttribute("aria-busy", "false");
    document.title = docTitle + " | " + PREFIX;
    document.getElementById("result-title").focus();
  }

  function extractToken(value) {
    let s = String(value || "").trim();
    const i = s.indexOf("/verify/");
    if (i !== -1) s = s.slice(i + 8);
    s = s.split(/[?#\s]/)[0].replace(/\/$/, "");
    try { s = decodeURIComponent(s); } catch (e) { /* keep as typed */ }
    return SHAPE.test(s) ? s : null;
  }

  function pasteForm() {
    const input = el("input", { type: "text", id: "paste", autocomplete: "off", spellcheck: "false", placeholder: "Paste the verification link" });
    const err = el("p", { class: "inline-err", role: "alert" });
    const form = el("form", { class: "paste" }, el("label", { for: "paste", text: "Certificate link or code" }), input, el("button", { type: "submit", text: "Verify" }), err);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const t = extractToken(input.value);
      if (!t) { err.textContent = "That doesn\u2019t look like a certificate link. Paste the full link from the certificate."; input.focus(); return; }
      location.assign("/verify/" + t);
    });
    return form;
  }

  function showLoading() {
    view.setAttribute("aria-busy", "true");
    view.replaceChildren(el("div", { class: "panel" }, el("div", { class: "badge", role: "status" }, el("span", { class: "spinner" }), el("h2", { text: "Checking certificate\u2026" }))));
  }

  function showEmpty() {
    show("neutral", "Verify a certificate", "Verify a certificate",
      el("p", { text: "Paste the verification link from a certificate, or scan the QR code printed on it." }),
      pasteForm());
  }

  function showMalformed() {
    show("bad", "Link incomplete", "This link looks incomplete",
      el("p", { text: "The verification link is cut short or has extra characters in it, so it could not be checked." }),
      el("p", { text: "Copy the full link from the certificate again, or scan its QR code. You can also paste the link below." }),
      pasteForm());
  }

  function showNotFound() {
    show("bad", "Not verified", "We couldn\u2019t verify this certificate",
      el("p", { text: "This link doesn\u2019t match any online assessment certificate issued by this site. That can happen when:" }),
      el("ul", {},
        el("li", { text: "the link or QR code was copied incompletely or mistyped," }),
        el("li", { text: "the certificate was changed after it was issued, or" }),
        el("li", {}, "it is a supervised assessment certificate, which is checked on the ", link(OTHER_TRACK_URL, "Dabik Technologies website"), ".")),
      el("p", { text: "Ask the certificate holder to share the verification link from the original PDF, or scan the QR code on it." }),
      el("p", { class: "muted", text: "This result means the certificate could not be verified here. It is not proof that anyone acted dishonestly." }),
      el("div", { class: "actions" }, link("/verify.html", "Verify another certificate", "btn ghost")));
  }

  function showUnavailable(token) {
    const retry = el("button", { type: "button", text: "Try again" });
    retry.addEventListener("click", () => check(token));
    show("warn", "Could not check", "We couldn\u2019t check this right now",
      el("p", { text: "Something went wrong on our side or with your connection. This does not mean the certificate is invalid." }),
      el("p", { text: "Check your internet connection and try again in a moment." }),
      el("div", { class: "actions" }, retry));
  }

  function formatDate(iso) {
    const d = new Date(String(iso) + "T00:00:00Z");
    return isNaN(d) ? String(iso) : d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  }

  function row(label, value, cls) { return el("div", {}, el("dt", { text: label }), el("dd", { class: cls || "", text: value })); }

  function showValid(d) {
    const note = el("span", { class: "muted", role: "status" });
    const copy = el("button", { type: "button", class: "ghost", text: "Copy link" });
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(location.href); note.textContent = "Link copied"; }
      catch (e) { note.textContent = "Copy the link from the address bar"; }
    });
    const print = el("button", { type: "button", class: "ghost", text: "Print" });
    print.addEventListener("click", () => window.print());

    show("ok", "Valid certificate", "This certificate is valid",
      el("dl", {},
        row("Name", String(d.name), "name"),
        row("Assessment", "Microsoft Office online assessment"),
        row("Type", "Unsupervised online assessment. Name as entered by the candidate."),
        row("Score", d.score + "%"),
        row("Issued", formatDate(d.date)),
        row("Issuer", "Dabik Technologies"),
        row("Certificate ID", String(d.id), "mono")),
      el("p", { class: "muted", text: "Every certificate carries a digital signature made when it was issued. The signature on this one matches, so the details above are exactly as they were issued." }),
      el("div", { class: "actions" }, copy, print, note));
  }

  async function check(token) {
    showLoading();
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 10000);
    try {
      const r = await fetch("/api/verify?t=" + encodeURIComponent(token), { signal: ctl.signal, cache: "no-store" });
      let d = null;
      try { d = await r.json(); } catch (e) { /* not JSON */ }
      if (r.ok && d && d.valid === true) return showValid(d);
      if (d && d.valid === false && d.reason === "malformed") return showMalformed();
      if (d && d.valid === false && d.reason === "not_found") return showNotFound();
      return showUnavailable(token);
    } catch (e) {
      return showUnavailable(token);
    } finally {
      clearTimeout(timer);
    }
  }

  const m = location.pathname.match(/\/verify\/([^/]+)\/?$/);
  if (!m) { showEmpty(); return; }
  let token = m[1];
  try { token = decodeURIComponent(token); } catch (e) { /* keep raw */ }
  if (!SHAPE.test(token)) { showMalformed(); return; }
  check(token);
})();
</script>
</body>
</html>
