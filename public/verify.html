<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verify certificate</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1b1f24; --muted:#5d6672; --line:#d9d6cd; --ok:#1f6b3a; --bad:#a32020; --accent:#0f4c81; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15181c; --fg:#ecebe6; --muted:#9aa3ad; --line:#2d333b; --ok:#7fd59b; --bad:#ff8a8a; --accent:#6fa8dc; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width:560px; margin:0 auto; padding:40px 18px; }
  h1 { font-size:1.7rem; margin:0 0 6px; }
  .status { font-weight:700; margin:0 0 22px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  dl { margin:0; border-top:1px solid var(--line); }
  dl div { display:flex; gap:16px; padding:12px 0; border-bottom:1px solid var(--line); }
  dt { width:120px; color:var(--muted); flex:none; }
  dd { margin:0; font-weight:600; word-break:break-word; }
  .note { color:var(--muted); font-size:.95rem; margin-top:22px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Certificate verification</h1>
  <p id="status" class="status">Checking...</p>
  <dl id="details"></dl>
  <p id="note" class="note"></p>
</main>
<script>
(async () => {
  const status = document.getElementById("status"), details = document.getElementById("details"), note = document.getElementById("note");
  const token = decodeURIComponent(location.pathname.split("/verify/")[1] || "");
  const row = (k, v) => { const d = document.createElement("div"), a = document.createElement("dt"), b = document.createElement("dd"); a.textContent = k; b.textContent = v; d.append(a, b); details.appendChild(d); };
  try {
    const r = await fetch("/api/verify?t=" + encodeURIComponent(token));
    const d = await r.json();
    if (!r.ok || !d.valid) {
      status.textContent = "Not found among online assessment certificates."; status.className = "status bad";
      note.append("If this is a supervised assessment certificate, check it on the ");
      const a = document.createElement("a"); a.href = "https://YOUR-DABIK-SITE/verify"; a.textContent = "Dabik Technologies website"; // replace with the real URL
      note.append(a, ".");
      return;
    }
    status.textContent = "This certificate is valid."; status.className = "status ok";
    row("Name", d.name);
    row("Assessment", "Microsoft Office online assessment");
    row("Type", "Unsupervised. Name as entered by the candidate.");
    row("Score", d.score + "%");
    row("Issued", d.date);
    row("Issuer", "Dabik Technologies");
    row("Certificate ID", d.id);
  } catch { status.textContent = "Could not check right now. Try again shortly."; status.className = "status bad"; }
})();
</script>
</body>
</html>
